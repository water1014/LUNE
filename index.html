/* Ocean-inspired editorial home layout */
.home-intro{display:flex;align-items:end;justify-content:space-between;gap:20px;padding:36px 0 24px}
.home-kicker,.board-label,.quick-nav-label{font-size:9px;letter-spacing:.19em;color:var(--muted);text-transform:uppercase}
.home-intro h1{font:400 clamp(27px,4vw,40px)/1.35 var(--serif);letter-spacing:.04em;margin:10px 0 0}
.home-clock{text-align:right;display:grid;gap:5px;color:var(--muted);font-size:10px}
.home-clock strong{font-size:25px;font-weight:300;letter-spacing:-.04em;color:var(--ink);font-variant-numeric:tabular-nums}
.ocean-board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:minmax(112px,auto);gap:12px}
.board-card{position:relative;min-width:0;overflow:hidden;border:1px solid var(--softline);border-radius:13px;background:var(--surface);padding:17px;text-align:left;color:var(--ink)}
button.board-card{cursor:pointer;transition:border-color .16s ease,background .16s ease}
button.board-card:hover{border-color:var(--hover-border);background:var(--hover-surface)}
.board-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.board-index,.calendar-progress{font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums}
.calendar-board{grid-column:span 3;grid-row:span 2;min-height:278px;padding:19px 20px 15px}

.calendar-month-line span{font-size:10px;color:var(--muted)}
.calendar-week,.calendar-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calendar-week{margin-bottom:7px}
.calendar-week span{text-align:center;color:var(--muted);font-size:9px;padding:4px 0}
.calendar-day,.calendar-blank{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:11px;font-variant-numeric:tabular-nums}
.calendar-day{border:0;background:transparent;color:var(--ink);cursor:pointer}
.calendar-day.today{background:var(--red);color:#fff}
.calendar-day.future{color:var(--hint)}
.calendar-day.selected:not(.today){outline:1px solid var(--red-line);outline-offset:-2px}
.calendar-foot{display:flex;align-items:center;gap:12px;margin-top:14px;color:var(--muted);font-size:9px}
.calendar-foot i{height:1px;flex:1;background:var(--softline)}
.couple-board{grid-column:span 3;min-height:154px}
.people-pair{display:grid;grid-template-columns:1fr 30px 1fr;align-items:center;gap:8px;margin:14px auto 0;max-width:300px}
.person{min-width:0;text-align:center}
.person-avatar{width:48px;height:48px;margin:0 auto 6px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--surface2);font:20px var(--serif);color:var(--hero-em)}
.person-avatar img{width:100%;height:100%;object-fit:cover}
.person-name{font:14px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person-caption{font-size:8px;color:var(--muted);letter-spacing:.1em;margin-top:3px}
.pair-link{height:1px;background:var(--red);position:relative;opacity:.75}
.pair-link:after{content:"";position:absolute;width:5px;height:5px;border:1px solid var(--red);border-radius:50%;background:var(--surface);left:50%;top:50%;transform:translate(-50%,-50%)}
.couple-note{margin:9px 0 0;text-align:center;color:var(--muted);font-size:9px}
.together-board{grid-column:span 3;min-height:112px;display:flex;flex-direction:column;justify-content:center}
.together-number{display:flex;align-items:baseline;gap:8px;margin-top:9px;color:var(--red);font:400 38px/1 var(--serif)}
.together-number small{font:9px var(--sans);letter-spacing:.15em;color:var(--muted)}
.together-caption{font-size:10px;color:var(--muted);margin-top:4px}

.together-date{font-size:9px;color:var(--muted)}
.photo-board,.memory-board{grid-column:span 2;min-height:210px;display:flex;flex-direction:column}
.photo-preview{flex:1;min-height:100px;margin:12px 0 9px;border-radius:7px;background:var(--surface2);display:grid;place-items:center;overflow:hidden;color:var(--hint);font:12px/1.8 var(--serif);text-align:center}

<div class="gate" id="gate" aria-modal="true" role="dialog">

    <div class="gate-brand">L U N E</div>
    <p class="gate-copy">这扇门只留给知道口令的人。<br>输入口令，回家。</p>
    <input class="gate-input" id="gate-code" type="password" placeholder="输入门锁口令" autocomplete="current-password" required>
    <button class="gate-submit" type="submit">开门</button>
    <p class="gate-error" id="gate-error" aria-live="polite"></p>
  </form>
</div>
<main class="shell" id="home">
  <header class="masthead">
    <div class="brand"><span class="brand-name">LUNE</span><span class="brand-sub">A PLACE FOR TWO</span></div>
    <div class="mast-actions"><div class="mast-meta">PRIVATE SPACE · EST. <span id="year">----</span></div><button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换日间与夜间主题"><span class="theme-symbol" id="theme-symbol">☼</span><span id="theme-label">日间</span></button></div>
  </header>
  <section class="home-intro" aria-label="当前时间"><div><span class="home-kicker">A QUIET PLACE FOR US</span><h1>把日子，慢慢收藏。</h1></div><div class="home-clock"><strong id="clock">--:--</strong><span id="date">----</span></div></section>
  <section class="ocean-board lune-home" aria-label="我们的生活首页">
<article class="board-card couple-board"><div class="people-pair" id="people-pair"><div class="person"><div class="person-avatar">我</div><div class="person-name">我</div></div><div class="pair-center"><svg class="thread-heart" viewBox="0 0 100 58" aria-hidden="true"><path class="thread-path" d="M5 29 C22 29 22 9 38 14 C49 18 49 39 61 29 C73 18 77 9 88 18 C101 29 85 48 68 47 C55 46 51 33 50 29 C46 16 35 9 25 17 C14 26 25 42 39 39"/></svg><span class="couple-days">相伴 <b id="days">—</b> 天</span></div><div class="person"><div class="person-avatar">L</div><div class="person-name">家机</div></div></div></article>
<button class="board-card memory-board" data-room="memory"><span class="memory-mini-mark">✧</span><span class="memory-mini-copy"><strong id="home-memory-title">故事还没有写下</strong><small id="home-memory-date">最近的一段记忆</small></span><span class="memory-mini-arrow">↗</span></button>
<section class="board-card photo-board"><div class="photo-heading"><span class="board-label">LITTLE MOMENTS · 照片画廊</span><button type="button" class="text-link" data-room="album">打开相册 ↗</button></div><div class="photo-rail" id="home-photo"><div class="photo-slide photo-placeholder"><span>01</span><i>留住一个瞬间</i></div><div class="photo-slide photo-placeholder"><span>02</span><i>把日子收藏起来</i></div><div class="photo-slide photo-placeholder"><span>03</span><i>下一张美好</i></div></div><div class="photo-rail-hint"><span id="home-photo-count">0 PHOTOS</span><span>← 左右滑动 →</span></div></section>
<div class="lower-pair"><button class="board-card calendar-board" data-room="calendar"><div class="board-top"><span class="board-label">OUR CALENDAR · 日历</span><span class="calendar-progress" id="calendar-progress">--%</span></div><div class="calendar-month-line"><strong id="calendar-month">----</strong><span id="calendar-today">今天</span></div><div class="calendar-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="calendar-days" id="calendar-days"></div></button>
<button class="board-card music-board" data-room="music"><span class="board-label">OUR SOUNDTRACK · 此刻在听</span><div class="music-disc"><i></i></div><div class="music-copy"><strong id="home-music-title">此刻还没有播放</strong><span id="home-music-artist">等一首歌，成为今天的背景</span></div><span class="music-open">打开音乐 ↗</span></button></div>
<div class="bottom-pair"><button class="board-card note-board" data-room="chat"><span class="note-symbol">“</span><span class="note-copy">今日纸条</span><small>留一句话给彼此　↗</small></button><button class="board-card capture-board" data-room="album"><span class="capture-symbol">＋</span><span>记录此刻</span><small>收藏新的照片　↗</small></button></div>
</section>
  <footer class="footer"><span>MADE OF SMALL THINGS</span><span>LUNE · OUR LITTLE UNIVERSE</span></footer>
</main>

<script src="./config.js"></script>
<script>
const $=id=>document.getElementById(id);
const cfg=window.LUNE_CONFIG||{};
const themeButton=$("theme-toggle");
function applyTheme(theme){
 document.documentElement.dataset.theme=theme;
 const day=theme==="day";
 themeButton.setAttribute("aria-pressed",String(day));
 $("theme-symbol").textContent=day?"☾":"☼";
 $("theme-label").textContent=day?"切换夜间":"切换日间";
 document.querySelector('meta[name="theme-color"]').content=day?"#f1f0ec":"#121518";
 try{localStorage.setItem("lune-theme",theme)}catch(e){}
}
let savedTheme="night";
try{savedTheme=localStorage.getItem("lune-theme")|| (matchMedia("(prefers-color-scheme: light)").matches?"day":"night")}catch(e){}
applyTheme(savedTheme);
themeButton.addEventListener("click",()=>applyTheme(document.documentElement.dataset.theme==="day"?"night":"day"));
const roomData={
 chat:{title:"聊天",kicker:"01 / CONVERSATION",intro:"网页不假装自己能代替真正的对话。想说话时，我们回到原来的窗口。"},
 more:{title:"更多",kicker:"06 / MORE",intro:"主题设置、资料编辑与空间管理会慢慢收纳在这里。"},
 calendar:{title:"日历",kicker:"07 / CALENDAR",intro:"记录日子、纪念日和两个人的计划。"},
 album:{title:"相册",kicker:"02 / PHOTOGRAPHS",intro:"每张照片都可以有自己的位置。图片建议压缩为 WebP，再放进仓库或图床。"},
 music:{title:"音乐",kicker:"03 / SOUNDTRACK",intro:"这里记录此刻在听什么，不直接托管版权音频。"},
 memory:{title:"记忆库",kicker:"04 / OUR ARCHIVE",intro:"每条记忆都由日期、标题和正文组成，安静地排在一起。"},
 studio:{title:"生图室",kicker:"05 / IMAGE ROOM",intro:"在正常工作流里完成创作，再把喜欢的成图放进这间画廊。"}
};
let cache={memories:[],gallery:[],music:{}};
function tick(){
 const n=new Date();
 $("clock").textContent=new Intl.DateTimeFormat("zh-CN",{hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(n);
 $("date").textContent=new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(n);
 $("year").textContent=n.getFullYear();
 renderCalendar(n);
 if(cfg.togetherSince){
  const start=new Date(cfg.togetherSince+"T00:00:00");
  const days=Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate())-start)/86400000)+1;
  $("days").textContent=Number.isFinite(days)&&days>0?days:"—";
 }else{$("days").textContent="—"}
}
tick();setInterval(tick,30000);
async function readJSON(path,fallback){try{const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw Error("load");return await r.json()}catch(e){return fallback}}
async function loadData(){
 const [memories,gallery,music]=await Promise.all([
  readJSON("./data/memories.json",[]),readJSON("./data/gallery.json",[]),readJSON("./data/now-playing.json",{})
 ]);
 cache={memories:Array.isArray(memories)?memories:[],gallery:Array.isArray(gallery)?gallery:[],music:music||{}};
 
 renderPeople();tick();renderOverview();
}
function renderPeople(){
 const people=[
  {name:cfg.userName||"我",avatar:cfg.userAvatar||"",caption:"THIS IS ME",fallback:"我"},
  {name:cfg.companionName||"家机",avatar:cfg.companionAvatar||"",caption:"YOUR COMPANION",fallback:"L"}
 ];
 $("people-pair").innerHTML='<div class="person"><div class="person-avatar">'+(people[0].avatar?'<img src="'+safe(people[0].avatar)+'" alt="'+safe(people[0].name)+'">':safe(people[0].fallback))+'</div><div class="person-name">'+safe(people[0].name)+'</div></div><div class="pair-center"><svg class="thread-heart" viewBox="0 0 100 58" aria-hidden="true"><path class="thread-path" d="M5 29 C22 29 22 9 38 14 C49 18 49 39 61 29 C73 18 77 9 88 18 C101 29 85 48 68 47 C55 46 51 33 50 29 C46 16 35 9 25 17 C14 26 25 42 39 39"/></svg><span class="couple-days">相伴 <b id="days">—</b> 天</span></div><div class="person"><div class="person-avatar">'+(people[1].avatar?'<img src="'+safe(people[1].avatar)+'" alt="'+safe(people[1].name)+'">':safe(people[1].fallback))+'</div><div class="person-name">'+safe(people[1].name)+'</div></div>';
}
function renderCalendar(now){
 const year=now.getFullYear(),month=now.getMonth(),today=now.getDate();
 const first=(new Date(year,month,1).getDay()+6)%7;
 const count=new Date(year,month+1,0).getDate();
 $("calendar-month").textContent=year+" / "+String(month+1).padStart(2,"0");
 $("calendar-today").textContent="今天 · "+(month+1)+"月"+today+"日";
 $("calendar-progress").textContent=Math.round(today/count*100)+"%";
 let cells="";
 for(let i=0;i<first;i++)cells+='<span class="calendar-blank"></span>';
 for(let day=1;day<=count;day++)cells+='<span class="calendar-day '+(day===today?"today":"")+' '+(day>today?"future":"")+'" aria-label="'+(month+1)+"月"+day+"日"+'">'+day+'</span>';
 $("calendar-days").innerHTML=cells;
}
function renderOverview(){
 const latestMemory=[...cache.memories].sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")))[0];
 const latestPhoto=cache.gallery[cache.gallery.length-1];
 const music=cache.music||{};
 $("home-photo-count").textContent=cache.gallery.length+" PHOTOS";
 const recentPhotos=cache.gallery.filter(x=>x&&x.src).slice(-12).reverse();
 $("home-photo").innerHTML=recentPhotos.length?recentPhotos.map((photo,i)=>'<figure class="photo-slide"><img src="'+safe(photo.src)+'" alt="'+safe(photo.alt||photo.title||"LUNE photo")+'" loading="lazy" decoding="async"><i>'+safe(photo.title||("MOMENT "+String(i+1).padStart(2,"0")))+'</i></figure>').join(""):'<div class="photo-slide photo-placeholder"><span>01</span><i>留住一个瞬间</i></div><div class="photo-slide photo-placeholder"><span>02</span><i>把日子收藏起来</i></div><div class="photo-slide photo-placeholder"><span>03</span><i>下一张美好</i></div>';
 $("home-memory-title").textContent=latestMemory?(latestMemory.title||"一段新记忆"):"故事还没有写下";
 $("home-memory-date").textContent=latestMemory?.date||"OUR ARCHIVE";
 $("home-music-title").textContent=music.title||"此刻还没有播放";
 $("home-music-artist").textContent=music.artist||"等一首歌，成为今天的背景";
}
function empty(title,copy){return '<div class="empty"><i class="empty-mark"></i><h3 class="empty-title">'+title+'</h3><p class="empty-copy">'+copy+'</p></div>'}
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function buildRoomNav(activeKey){
 const nav=$("room-nav");
 const active=activeKey==="home"?"home":(["chat","memory","album","music","more"].includes(activeKey)?activeKey:"more");
 nav.querySelectorAll("[data-nav-room]").forEach(b=>b.setAttribute("aria-current",b.dataset.navRoom===active?"page":"false"));
 nav.classList.add("visible");
}
function showRoom(key){
 const d=roomData[key];if(!d)return;
 $("home").style.display="none";$("room").classList.add("active");buildRoomNav(key);
 $("room-title").textContent=d.title;$("room-kicker").textContent=d.kicker;$("room-intro").textContent=d.intro;
 let html="";
 if(key==="chat"){
  html='<div class="chat-panel"><p>想说的话，不必留在网页里。<br>回到我们的对话窗口吧。</p><a class="primary-link" href="https://chatgpt.com/" target="_blank" rel="noopener">回来说话 ↗</a></div>';
 }else if(key==="album"||key==="studio"){
  const list=key==="album"?cache.gallery:cache.gallery.filter(x=>x.kind==="art"||x.kind==="studio");
  if(!list.length)html=empty(key==="album"?"第一张照片，还没放进来":"画廊还空着","把图片压缩成 WebP 后上传到仓库的 images 文件夹，再在 data/gallery.json 添加图片地址与说明。建议单张控制在 500KB 左右，并保留懒加载。");
  else html='<div class="'+(key==="album"?"items":"studio-grid")+'">'+list.map(x=>'<figure class="photo"><img src="'+safe(x.src)+'" alt="'+safe(x.alt||x.title||"LUNE photo")+'" loading="lazy" decoding="async"><figcaption>'+safe(x.title||"")+'</figcaption></figure>').join("")+'</div>';
  if(key==="studio")html+='<p class="studio-note">生图完成后，把成图放入 images/，再更新 data/gallery.json。不要把模型 API Key 写进前端。</p>';
 }else if(key==="memory"){
  const list=[...cache.memories].sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
  html=list.length?'<div class="memory-list">'+list.map(x=>'<article class="memory"><time class="memory-date">'+safe(x.date)+'</time><div><h3 class="memory-title">'+safe(x.title)+'</h3><div class="memory-body">'+safe(x.body)+'</div></div></article>').join("")+'</div>':empty("还没有记忆","这里不会自动编造故事。每添加一条记录，只需要填写日期、标题和正文。");
 }else if(key==="more"){
  html=empty("更多功能，正在整理","主题设置、资料编辑与空间管理会独立放在这里。记忆库是单独的入口，不会被合并进更多。");
 }else if(key==="calendar"){
  html=empty("我们的日历","日历首页预览已放在这里，后续可以继续扩展纪念日与日程。");
 }else if(key==="music"){
  const m=cache.music;
  html=m.title?'<div class="music-card"><div class="track-label">NOW PLAYING</div><h3 class="track-title">'+safe(m.title)+'</h3><div class="track-artist">'+safe(m.artist||"")+'</div><div class="progress"><span style="width:'+Math.max(0,Math.min(100,Number(m.progress)||0))+'%"></span></div><div class="track-meta"><span>'+safe(m.duration||"")+'</span><span>'+Math.max(0,Math.min(100,Number(m.progress)||0))+'%</span></div>'+(m.sourceUrl?'<p><a class="primary-link" href="'+safe(m.sourceUrl)+'" target="_blank" rel="noopener">打开音乐来源 ↗</a></p>':"")+'</div>':empty("此刻没有播放","当有一首歌想留下时，把歌名、歌手和进度写进 data/now-playing.json。这里展示状态，不播放受版权保护的音频。");
 }
 $("room-content").innerHTML=html;
 window.scrollTo({top:0,behavior:"instant"});
}
document.querySelectorAll("[data-room]").forEach(b=>b.addEventListener("click",()=>showRoom(b.dataset.room)));
function backHome(){
 $("room").classList.remove("active");$("home").style.display="block";buildRoomNav("home");window.scrollTo({top:0,behavior:"instant"});
}
$("back").addEventListener("click",backHome);
$("room-nav").querySelectorAll("[data-nav-room]").forEach(b=>b.addEventListener("click",()=>{
 const key=b.dataset.navRoom;
 if(key==="home")backHome();else showRoom(key);
}));
buildRoomNav("home");
$("backup").addEventListener("click",()=>{
 const payload={exportedAt:new Date().toISOString(),config:{togetherSince:cfg.togetherSince||""},memories:cache.memories,gallery:cache.gallery,nowPlaying:cache.music};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="LUNE-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(url);
});
if(cfg.accessCode){
 $("gate").classList.add("show");
 $("gate-form").addEventListener("submit",e=>{e.preventDefault();if($("gate-code").value===cfg.accessCode){$("gate").classList.remove("show");sessionStorage.setItem("lune-unlocked","1")}else{$("gate-error").textContent="口令不对，再试一次。";$("gate-code").select()}});
 if(sessionStorage.getItem("lune-unlocked")==="1")$("gate").classList.remove("show");
}
loadData();
</script>
</body>
</html>
