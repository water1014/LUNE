<style>

.mast-right{display:flex;align-items:center;gap:12px}.year{font-size:8px;letter-spacing:.14em;color:var(--muted)}.theme-toggle{border:1px solid var(--line);background:transparent;border-radius:30px;padding:6px 9px;font-size:9px;color:var(--muted)}

.pair-center{display:flex;flex-direction:column;align-items:center;justify-content:center}.heart{width:min(100%,132px);height:43px;overflow:visible}.heart path{fill:none;stroke:var(--red);stroke-width:1.45;stroke-linecap:round;stroke-dasharray:230;stroke-dashoffset:230;animation:draw 3.4s ease-in-out infinite alternate}@keyframes draw{to{stroke-dashoffset:0}}.days{font-size:8px;color:var(--muted);letter-spacing:.04em}.days b{color:var(--red);font-weight:500}

.gallery{padding:10px 9px 8px;aspect-ratio:1/1;min-width:0;display:flex;flex-direction:column;overflow:hidden}.photo-rail{position:relative;flex:1;min-height:0;width:100%;overflow:hidden;padding:8px 3px 9px;touch-action:pan-y;display:block;cursor:grab}.photo-rail:active{cursor:grabbing}.photo{position:absolute;left:50%;top:50%;width:clamp(76px,24vw,104px);aspect-ratio:1/1;margin:0;border-radius:12px;overflow:hidden;background:linear-gradient(145deg,var(--paper2),var(--bg));border:2px solid rgba(255,255,255,.82);box-shadow:0 8px 22px rgba(61,43,51,.16);cursor:zoom-in;transition:transform .28s cubic-bezier(.2,.75,.25,1),opacity .28s ease,filter .28s ease;transform-origin:center center}.photo[data-stack="0"]{z-index:4;transform:translate(-50%,-50%) scale(1);opacity:1}.photo[data-stack="1"]{z-index:3;transform:translate(calc(-50% + 13px),calc(-50% - 2px)) rotate(5deg) scale(.96);opacity:.92}.photo[data-stack="2"]{z-index:2;transform:translate(calc(-50% - 13px),calc(-50% + 3px)) rotate(-5deg) scale(.92);opacity:.82}.photo[data-stack="3"]{z-index:1;transform:translate(calc(-50% + 3px),calc(-50% + 8px)) rotate(2deg) scale(.88);opacity:.62}.photo[data-stack="hidden"]{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.82)}.photo:active{filter:brightness(.96)}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 7px 6px;background:linear-gradient(transparent,rgba(0,0,0,.48));font:9px var(--serif);color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.photo-empty{display:grid;place-items:center;color:var(--muted);font:11px var(--serif);text-align:center;padding:8px;cursor:default}
.rail-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:7px;letter-spacing:.08em}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:stretch}.calendar,.music{min-height:122px;padding:10px 11px;text-align:left;width:100%}
.month-line{display:flex;justify-content:space-between;align-items:baseline;margin:7px 0 5px}.month-line strong{font:17px var(--serif);font-weight:400}.month-line span{font-size:7px;color:var(--muted)}
.week,.days-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px}.week span{text-align:center;font-size:7px;color:var(--muted);padding:2px 0}.day,.blank{aspect-ratio:1;display:grid;place-items:center;font-size:8px;border-radius:50%;font-variant-numeric:tabular-nums}.day.today{background:var(--red);color:white}.day.future{color:var(--muted)}
.music{display:grid;grid-template-columns:58px 1fr;grid-template-rows:auto 1fr auto;gap:3px 10px;align-items:center;min-height:112px}.music .section-line{grid-column:1/-1}.vinyl{width:53px;height:53px;border-radius:50%;grid-row:2/4;background:repeating-radial-gradient(circle,var(--paper) 0 3px,var(--line) 4px 5px);border:1px solid var(--line);display:grid;place-items:center;animation:spin 12s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.vinyl:after{content:"";width:13px;height:13px;background:var(--red);border:3px solid var(--paper2);border-radius:50%}.track{min-width:0;align-self:end}.track strong{display:block;font:12px var(--serif);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track span{display:block;font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.music-open{grid-column:2;font-size:7px;color:var(--muted)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick button{min-height:51px;padding:8px 11px;display:grid;grid-template-columns:22px 1fr;grid-template-rows:auto auto;gap:1px 7px;text-align:left;align-content:center}.quick-mark{grid-row:1/3;color:var(--red);font:20px var(--serif);align-self:center;text-align:center}.quick strong{font:12px var(--serif);font-weight:400}.quick small{font-size:7px;color:var(--muted)}
.footer{display:flex;justify-content:space-between;color:var(--muted);font-size:7px;letter-spacing:.12em;padding:10px 2px 0}
.nav{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(7px + env(safe-area-inset-bottom));width:min(620px,calc(100% - 18px));display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:5px 4px;border:1px solid var(--line);border-radius:15px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 28px rgba(20,15,15,.08)}
.nav button{min-width:0;min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav button[aria-current=page]{background:var(--paper2);color:var(--red)}.nav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}.nav span{font-size:7px;white-space:nowrap}
.room{display:none}.room.active{display:block}.room-head{display:flex;justify-content:space-between;align-items:end;gap:20px;border-bottom:1px solid var(--line);padding:24px 0 17px;margin-bottom:20px}.room-kicker{font-size:8px;letter-spacing:.2em;color:var(--muted)}.room-title{font:36px var(--serif);font-weight:400;margin:7px 0 0}.room-intro{font-size:10px;color:var(--muted);line-height:1.7;max-width:230px;text-align:right}.back{border:0;background:none;padding:0;color:var(--muted);font-size:9px;letter-spacing:.14em}.empty{min-height:200px;display:grid;place-content:center;text-align:center;padding:24px}.empty strong{font:20px var(--serif);font-weight:400}.empty p{font-size:10px;color:var(--muted);line-height:1.8;max-width:300px}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.items figure{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}.items img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}.items figcaption{padding:9px;font-size:9px;color:var(--muted)}.memory-list{border-top:1px solid var(--line)}.memory-entry{display:grid;grid-template-columns:82px 1fr;gap:14px;padding:17px 0;border-bottom:1px solid var(--soft)}.memory-entry time{font-size:9px;color:var(--muted)}.memory-entry h3{font:18px var(--serif);font-weight:400;margin:0 0 7px}.memory-entry p{font-size:11px;line-height:1.8;color:var(--muted);white-space:pre-wrap;margin:0}.room-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px}.room-card h3{font:23px var(--serif);font-weight:400;margin:0 0 8px}.room-card p{font-size:11px;color:var(--muted);line-height:1.8}.backup{margin-top:25px;border:1px solid var(--line);background:transparent;border-radius:30px;padding:10px 14px;color:var(--muted);font-size:9px}
.gate{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);place-items:center;padding:20px}.gate.show{display:grid}.gate-card{width:min(360px,100%);padding:28px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}.gate-title{font:22px var(--serif);letter-spacing:.2em}.gate p{font-size:11px;color:var(--muted);line-height:1.8}.gate input{width:100%;height:43px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:0 12px}.gate button{width:100%;height:42px;margin-top:10px;border:1px solid var(--red-soft);background:var(--paper2);border-radius:7px}.gate-error{color:var(--red)}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;margin:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.setting-row strong,.setting-row small{display:block}.setting-row strong{font:14px var(--serif);font-weight:400}.setting-row small{font-size:9px;color:var(--muted);margin-top:5px}
.setting-row .theme-toggle{flex:none;padding:8px 13px;border-radius:20px;font-size:10px}
@media(max-width:390px){.shell{width:calc(100% - 30px);padding-top:16px}.brand-name{font-size:16px}.brand-sub{font-size:7px}.year{display:none}.intro h1{font-size:20px}.couple{padding:8px 12px;grid-template-columns:1fr minmax(80px,1.1fr) 1fr}.avatar{width:49px;height:49px}.person-name{font-size:11px}.heart{height:37px}.calendar,.music{min-height:116px;padding:8px}.music{grid-template-columns:46px 1fr;gap:3px 7px}.vinyl{width:43px;height:43px}.track strong{font-size:10px}.nav{width:calc(100% - 12px);gap:0;padding:4px 2px}.nav button{min-height:43px}.nav svg{width:18px;height:18px}.nav span{font-size:6.5px}}
/* PHONE-FIRST LAYOUT TUNING */
.duo{grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
.duo>.calendar,.duo>.gallery{width:100%;min-width:0;aspect-ratio:1/1;min-height:0}
.gallery{padding:9px 8px 7px}
.photo-rail{min-width:0;overscroll-behavior:contain}
.photo{width:clamp(72px,27vw,96px)}
.photo[data-stack="1"]{transform:translate(calc(-50% + 10px),calc(-50% - 2px)) rotate(3.5deg) scale(.96)}
.photo[data-stack="2"]{transform:translate(calc(-50% - 10px),calc(-50% + 3px)) rotate(-3.5deg) scale(.92)}
.photo[data-stack="3"]{transform:translate(calc(-50% + 2px),calc(-50% + 7px)) rotate(1.5deg) scale(.88)}
@media(max-width:390px){
 .shell{width:calc(100% - 26px);padding-top:14px}
 .home{gap:8px}
 .duo{gap:8px}
 .duo>.calendar,.duo>.gallery{aspect-ratio:1/1;min-height:0}
 .calendar{padding:8px 7px}
 .gallery{padding:8px 7px 6px}
 .photo{width:clamp(70px,26vw,86px);border-radius:10px}
 .photo-viewer{padding:calc(20px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom))}
 .photo-viewer img{max-width:94vw;max-height:72vh}
 .rail-foot{font-size:6.5px}
}
@media(max-width:340px){
 .shell{width:calc(100% - 22px)}
 .duo{gap:6px}
 .calendar{padding:7px 5px}
 .gallery{padding:7px 5px 5px}
 .photo{width:72px}
 .month-line strong{font-size:15px}
 .day,.blank{font-size:7px}
 .section-label{font-size:7px}
}
@media(min-width:700px){.home{gap:11px}.couple{min-height:112px}.gallery{max-width:100%;}.calendar,.gallery{min-height:0}.music{min-height:126px}.quick button{min-height:58px}}

/* LUNE GLASS MATERIAL SYSTEM */
:root{
 --bg:#e9e5e5;--paper:rgba(255,250,250,.43);--paper2:rgba(255,245,247,.30);

}

 --bg:#19181d;--paper:rgba(48,43,51,.54);--paper2:rgba(76,62,72,.36);
 --ink:#f0e9eb;--muted:#b0a1a8;--line:rgba(255,255,255,.13);

body{

<body>
<div class="gate" id="gate"><form class="gate-card" id="gate-form"><div class="gate-title">L U N E</div><p>这扇门只留给知道口令的人。<br>输入口令，回家。</p><input id="gate-code" type="password" placeholder="输入门锁口令" required><button type="submit">开门</button><div class="gate-error" id="gate-error"></div></form></div>
<main class="shell" id="home">

<section class="intro"><div><div class="eyebrow">A QUIET PLACE FOR US</div><h1>把日子，慢慢收藏。</h1></div><div class="clock"><strong id="clock">--:--</strong><span id="date"></span></div></section>
<section class="home" aria-label="我们的生活首页">
<div class="surface couple"><div class="person"><div class="avatar" id="avatar-me">我</div><div class="person-name" id="name-me">我</div></div><div class="pair-center"><svg class="heart" viewBox="0 0 120 58" aria-hidden="true"><path d="M4 30 C22 30 22 9 39 15 C50 19 51 40 63 30 C75 19 81 9 94 18 C111 29 91 49 73 47 C59 46 56 33 59 28 C64 16 48 8 36 17 C23 27 34 43 49 39"/></svg><div class="days">相伴 <b id="days">—</b> 天</div></div><div class="person"><div class="avatar" id="avatar-partner">L</div><div class="person-name" id="name-partner">家机</div></div></div>
<button class="surface memory" data-room="memory"><span class="memory-mark">✧</span><span class="memory-copy"><strong id="home-memory-title">故事还没有写下</strong><small id="home-memory-date">最近的一段记忆</small></span><span class="arrow">↗</span></button>
<button class="surface music" data-room="music"><div class="section-line"><span class="section-label">OUR SOUNDTRACK · 此刻的声音</span><span class="section-label">♫</span></div><div class="vinyl"></div><div class="track"><strong id="music-title">此刻还没有播放</strong><span id="music-artist">等一首歌，成为今天的背景</span></div><div class="music-open">打开音乐 ↗</div></button>
<div class="duo"><button class="surface calendar" data-room="calendar"><div class="section-line"><span class="section-label">OUR CALENDAR · 日历</span><span class="section-label" id="calendar-progress"></span></div><div class="month-line"><strong id="calendar-month">----</strong><span id="calendar-today">今天</span></div><div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="days-grid" id="calendar-days"></div></button>
<section class="surface gallery"><div class="section-line"><span class="section-label">LITTLE MOMENTS · 相册</span><button class="text-action" data-room="album">打开 ↗</button></div><div class="photo-rail" id="home-photo"><div class="photo photo-empty">留住一个瞬间</div><div class="photo photo-empty">把日子收藏起来</div><div class="photo photo-empty">下一张美好</div></div><div class="rail-foot"><span id="photo-count">0 PHOTOS</span><span id="stack-hint">轻扫翻看</span></div></section></div>

<footer class="footer"><span>MADE OF SMALL THINGS</span><span>LUNE · OUR LITTLE UNIVERSE</span></footer>
</main>
<section class="shell room" id="room"><button class="back" id="back">← 返回首页</button><header class="room-head"><div><div class="room-kicker" id="room-kicker">LUNE / ROOM</div><h1 class="room-title" id="room-title">房间</h1></div><div class="room-intro" id="room-intro"></div></header><div id="room-content"></div><button class="backup" id="backup">导出这间家的数据备份 ↓</button></section>

</nav>
<script src="./config.js"></script>
<script>
const $=id=>document.getElementById(id),cfg=window.LUNE_CONFIG||{};
let cache={memories:[],gallery:[],music:{}};
const safe=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem("lune-theme",t);const toggle=$("theme-toggle");if(toggle)toggle.textContent=t==="night"?"☼ 日间":"☾ 夜间";document.querySelector('meta[name="theme-color"]').content=t==="night"?"#171719":"#f3f0ed"}
applyTheme(localStorage.getItem("lune-theme")||"day");
document.addEventListener("click",e=>{if(e.target.closest("#theme-toggle"))applyTheme(document.documentElement.dataset.theme==="night"?"day":"night")});
function tick(){const n=new Date();$("clock").textContent=new Intl.DateTimeFormat("zh-CN",{hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(n);$("date").textContent=new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(n);$("year")&&($("year").textContent=n.getFullYear());calendar(n);if(cfg.togetherSince){const d=new Date(cfg.togetherSince+"T00:00:00");const days=Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate())-d)/86400000)+1;$("days").textContent=Number.isFinite(days)&&days>0?days:"—"}}
function calendar(n){const y=n.getFullYear(),m=n.getMonth(),today=n.getDate(),first=(new Date(y,m,1).getDay()+6)%7,count=new Date(y,m+1,0).getDate();$("calendar-month").textContent=y+" / "+String(m+1).padStart(2,"0");$("calendar-today").textContent=(m+1)+"月"+today+"日";$("calendar-progress").textContent=Math.round(today/count*100)+"%";let s="";for(let i=0;i<first;i++)s+='<i class="blank"></i>';for(let d=1;d<=count;d++)s+='<span class="day '+(d===today?"today":"")+' '+(d>today?"future":"")+'">'+d+"</span>";$("calendar-days").innerHTML=s}
async function readJSON(p,f){try{const r=await fetch(p,{cache:"no-store"});if(!r.ok)throw 0;return await r.json()}catch(e){return f}}
function setPerson(idName,idAvatar,name,avatar,fallback){$(idName).textContent=name||fallback;$(idAvatar).innerHTML=avatar?'<img src="'+safe(avatar)+'" alt="'+safe(name||fallback)+'">':safe(fallback)}
let stackIndex=0;function paintStack(){const cards=[...$("home-photo").querySelectorAll("[data-photo-src]")];cards.forEach((card,i)=>{const n=(i-stackIndex+cards.length)%cards.length;card.dataset.stack=n<4?String(n):"hidden"});$("stack-hint").textContent=cards.length>1?"轻扫翻看":""}
function overview(){const latest=[...cache.memories].sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")))[0],music=cache.music||[];$("home-memory-title").textContent=latest?(latest.title||"一段新记忆"):"故事还没有写下";$("home-memory-date").textContent=latest?.date||"最近的一段记忆";$("music-title").textContent=music.title||"此刻还没有播放";$("music-artist").textContent=music.artist||"等一首歌，成为今天的背景";$("photo-count").textContent=cache.gallery.length+" PHOTOS";const photos=cache.gallery.filter(x=>x&&x.src).slice(-12).reverse();stackIndex=0;$("home-photo").innerHTML=photos.length?photos.map((p,i)=>'<figure class="photo" role="button" tabindex="0" data-stack="hidden" data-photo-src="'+safe(p.src)+'" data-photo-title="'+safe(p.title||("MOMENT "+String(i+1).padStart(2,"0")))+'"><img src="'+safe(p.src)+'" alt="'+safe(p.alt||p.title||"LUNE photo")+'" loading="lazy"><figcaption>'+safe(p.title||("MOMENT "+String(i+1).padStart(2,"0")))+'</figcaption></figure>').join(""):'<div class="photo photo-empty" data-stack="0">留住一个瞬间</div><div class="photo photo-empty" data-stack="1">把日子收藏起来</div><div class="photo photo-empty" data-stack="2">下一张美好</div>';paintStack()}
const roomData={chat:["聊天","01 / CONVERSATION","想说的话，不必留在网页里。回到我们的对话窗口吧。"],memory:["记忆库","02 / OUR ARCHIVE","把重要的日子和细小的故事留在这里。"],album:["相册","03 / PHOTOGRAPHS","每张照片都可以有自己的位置。"],music:["音乐","04 / SOUNDTRACK","记录此刻在听什么，不直接托管版权音频。"],more:["更多","05 / MORE","主题设置、资料编辑与空间管理会收纳在这里。"],calendar:["日历","06 / CALENDAR","记录日子、纪念日和两个人的计划。"]};
function showRoom(key){const d=roomData[key];if(!d)return;$("home").style.display="none";$("room").classList.add("active");$("room-title").textContent=d[0];$("room-kicker").textContent=d[1];$("room-intro").textContent=d[2];let h="";if(key==="memory"){const list=[...cache.memories].sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));h=list.length?'<div class="memory-list">'+list.map(x=>'<article class="memory-entry"><time>'+safe(x.date)+'</time><div><h3>'+safe(x.title)+'</h3><p>'+safe(x.body)+'</p></div></article>').join("")+'</div>':'<div class="surface empty"><strong>还没有记忆</strong><p>每添加一条记录，只需要填写日期、标题和正文。</p></div>'}else if(key==="album"){h=cache.gallery.length?'<div class="items">'+cache.gallery.map(x=>'<figure><img src="'+safe(x.src)+'" alt="'+safe(x.alt||x.title||"")+'" loading="lazy"><figcaption>'+safe(x.title||"")+'</figcaption></figure>').join("")+'</div>':'<div class="surface empty"><strong>第一张照片，还没放进来</strong><p>把图片上传到 images 文件夹，再在 data/gallery.json 添加图片地址与说明。</p></div>'}else if(key==="music"){const m=cache.music||{};h='<div class="surface room-card"><h3>'+safe(m.title||"此刻没有播放")+'</h3><p>'+safe(m.artist||"当有一首歌想留下时，把歌名和歌手写进 data/now-playing.json。这里展示状态，不播放受版权保护的音频。")+'</p></div>'}else if(key==="chat"){h='<div class="surface room-card"><h3>想说的话，不必留在网页里。</h3><p>回到我们的对话窗口吧。</p><a href="https://chatgpt.com/" target="_blank" rel="noopener">回来说话 ↗</a></div>'}else if(key==="more"){h='<div class="surface room-card"><h3>空间设置</h3><p>让这间小屋，保持你喜欢的光线。</p><div class="setting-row"><div><strong>显示主题</strong><small>在日间与夜间氛围之间切换</small></div><button class="theme-toggle" id="theme-toggle" type="button">☾ 夜间</button></div><p>头像、名字和相伴日期可在 config.js 中自定义。</p></div>'}else{h='<div class="surface room-card"><h3>我们的日历</h3><p>日历预览已经放在首页，后续可以继续扩展纪念日与日程。</p></div>'}$("room-content").innerHTML=h;document.querySelectorAll("[data-nav-room]").forEach(b=>b.setAttribute("aria-current",b.dataset.navRoom===key?"page":"false"));window.scrollTo(0,0)}
function openPhoto(src,title){if(!src)return;$("photo-viewer-image").src=src;$("photo-viewer-image").alt=title||"LUNE photo";$("photo-viewer-caption").textContent=title||"";$("photo-viewer").classList.add("open");$("photo-viewer").setAttribute("aria-hidden","false");document.body.style.overflow="hidden"}
function closePhoto(){$("photo-viewer").classList.remove("open");$("photo-viewer").setAttribute("aria-hidden","true");$("photo-viewer-image").src="";document.body.style.overflow=""}
let touchStartX=0,stackWasSwiped=false;$("home-photo").addEventListener("touchstart",e=>{touchStartX=e.touches[0].clientX;stackWasSwiped=false},{passive:true});$("home-photo").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-touchStartX,cards=[...$("home-photo").querySelectorAll("[data-photo-src]")];if(cards.length>1&&Math.abs(dx)>22){stackIndex=(stackIndex+(dx<0?1:-1)+cards.length)%cards.length;paintStack();stackWasSwiped=true;setTimeout(()=>{stackWasSwiped=false},350)}},{passive:true});$("home-photo").addEventListener("click",e=>{if(stackWasSwiped){e.preventDefault();e.stopPropagation();return}const p=e.target.closest("[data-photo-src]");if(p)openPhoto(p.dataset.photoSrc,p.dataset.photoTitle)});
$("home-photo").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-photo-src]")){e.preventDefault();openPhoto(e.target.dataset.photoSrc,e.target.dataset.photoTitle)}});
$("photo-viewer-close").addEventListener("click",closePhoto);
$("photo-viewer").addEventListener("click",e=>{if(e.target.id==="photo-viewer")closePhoto()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePhoto()});
function home(){ $("room").classList.remove("active");$("home").style.display="block";document.querySelectorAll("[data-nav-room]").forEach(b=>b.setAttribute("aria-current",b.dataset.navRoom==="home"?"page":"false"));window.scrollTo(0,0)}
document.querySelectorAll("[data-room]").forEach(b=>b.addEventListener("click",()=>showRoom(b.dataset.room)));document.querySelectorAll("[data-nav-room]").forEach(b=>b.addEventListener("click",()=>b.dataset.navRoom==="home"?home():showRoom(b.dataset.navRoom)));$("back").addEventListener("click",home);
$("backup").addEventListener("click",()=>{const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),config:{togetherSince:cfg.togetherSince||""},memories:cache.memories,gallery:cache.gallery,nowPlaying:cache.music},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="LUNE-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(url)});
if(cfg.userName||cfg.userAvatar)setPerson("name-me","avatar-me",cfg.userName,cfg.userAvatar,"我");if(cfg.companionName||cfg.companionAvatar)setPerson("name-partner","avatar-partner",cfg.companionName,cfg.companionAvatar,"L");
if(cfg.accessCode){$("gate").classList.add("show");$("gate-form").addEventListener("submit",e=>{e.preventDefault();if($("gate-code").value===cfg.accessCode){$("gate").classList.remove("show");sessionStorage.setItem("lune-unlocked","1")}else $("gate-error").textContent="口令不对，再试一次。"});if(sessionStorage.getItem("lune-unlocked")==="1")$("gate").classList.remove("show")}
tick();setInterval(tick,30000);Promise.all([readJSON("./data/memories.json",[]),readJSON("./data/gallery.json",[]),readJSON("./data/now-playing.json",{})]).then(([memories,gallery,music])=>{cache={memories:Array.isArray(memories)?memories:[],gallery:Array.isArray(gallery)?gallery:[],music:music||{}};overview()});
</script>
</body>
