/* PHONE-FIRST LAYOUT TUNING */
.duo{grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
.duo>.calendar,.duo>.gallery{width:100%;min-width:0;aspect-ratio:1/1;min-height:0}
.gallery{padding:9px 8px 7px}
.photo-rail{min-width:0;overscroll-behavior:contain}
.photo{width:clamp(72px,27vw,96px)}
.photo[data-stack="1"]{transform:translate(calc(-50% + 10px),calc(-50% - 2px)) rotate(3.5deg) scale(.96)}
.photo[data-stack="2"]{transform:translate(calc(-50% - 10px),calc(-50% + 3px)) rotate(-3.5deg) scale(.92)}
.photo[data-stack="3"]{transform:translate(calc(-50% + 2px),calc(-50% + 7px)) rotate(1.5deg) scale(.88)}
@media(max-width:390px){
 .shell{width:calc(100% - 26px);padding-top:14px}

 .calendar{padding:8px 7px}

 .photo{width:clamp(70px,26vw,86px);border-radius:10px}

}

/* LUNE GLASS MATERIAL SYSTEM */
:root{
 --bg:#e9e5e5;--paper:rgba(255,250,250,.43);--paper2:rgba(255,245,247,.30);
 --ink:#40383c;--muted:#91858a;--line:rgba(255,255,255,.66);
 --soft:rgba(255,255,255,.34);--red:#89545e;--red-soft:#bd9299;
}
[data-theme=night]{
 --bg:#19181d;--paper:rgba(48,43,51,.54);--paper2:rgba(76,62,72,.36);
 --ink:#f0e9eb;--muted:#b0a1a8;--line:rgba(255,255,255,.13);
 --soft:rgba(255,255,255,.07);--red:#c58b98;--red-soft:#9b6875;
}
html,body{background-color:var(--bg)}
body{
 background:
  radial-gradient(ellipse at 8% 7%,rgba(255,255,255,.78),transparent 36%),
  radial-gradient(ellipse at 92% 22%,rgba(196,157,165,.25),transparent 34%),
  radial-gradient(ellipse at 48% 92%,rgba(255,255,255,.48),transparent 38%),
  linear-gradient(135deg,#e9e5e5 0%,#e2dcdf 48%,#eee9e8 100%);
 background-attachment:fixed;
}
[data-theme=night] body{
 background:
  radial-gradient(ellipse at 12% 8%,rgba(126,91,107,.22),transparent 38%),
  radial-gradient(ellipse at 90% 35%,rgba(91,79,105,.20),transparent 36%),
  linear-gradient(145deg,#17171c,#242027 58%,#19191f);
}
.surface,.room-card,.gate-card{
 background:linear-gradient(145deg,rgba(255,255,255,.58),rgba(255,255,255,.20));
 border:1px solid rgba(255,255,255,.72);
 box-shadow:0 12px 34px rgba(74,53,61,.075),inset 0 1px 0 rgba(255,255,255,.82),inset 0 -1px 0 rgba(255,255,255,.16);
 backdrop-filter:blur(24px) saturate(145%);
 -webkit-backdrop-filter:blur(24px) saturate(145%);
}
[data-theme=night] .surface,[data-theme=night] .room-card,[data-theme=night] .gate-card{
 background:linear-gradient(145deg,rgba(76,66,78,.64),rgba(39,36,45,.48));
 border-color:rgba(255,255,255,.15);
 box-shadow:0 14px 38px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.12);
}
.masthead{border-color:rgba(255,255,255,.48)}
.theme-toggle,.backup{
 background:rgba(255,255,255,.30);border-color:rgba(255,255,255,.65);
 backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
[data-theme=night] .theme-toggle,[data-theme=night] .backup{

}
.couple{background:linear-gradient(125deg,rgba(255,255,255,.64),rgba(255,255,255,.22))}
.avatar{
 background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(230,219,224,.36));

 box-shadow:0 5px 16px rgba(82,59,67,.10),inset 0 1px 2px rgba(255,255,255,.9)
}
[data-theme=night] .avatar{background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.035));border-color:rgba(255,255,255,.2)}
.gallery{background:linear-gradient(135deg,rgba(255,255,255,.58),rgba(255,255,255,.19))}
.photo{border:1px solid rgba(255,255,255,.78);box-shadow:0 5px 16px rgba(61,43,51,.10)}
.day.today{box-shadow:0 0 0 3px rgba(255,255,255,.38),0 3px 12px rgba(137,84,94,.25)}

.photo-viewer.open{display:flex}.photo-viewer img{display:block;max-width:min(92vw,620px);max-height:76vh;aspect-ratio:1/1;object-fit:contain;border-radius:13px;border:1px solid rgba(255,255,255,.42);box-shadow:0 22px 70px rgba(0,0,0,.35)}

/* RELATION SPACE: quieter line, more room for the two portraits */
.couple{
 min-height:116px;
 grid-template-columns:minmax(0,1fr) minmax(108px,1.15fr) minmax(0,1fr);
 gap:10px;
 padding:13px 22px;
 border-radius:16px;
 background:linear-gradient(112deg,rgba(255,255,255,.66),rgba(255,250,250,.30) 52%,rgba(255,255,255,.52));
}
.couple .avatar{
 width:64px;height:64px;margin-bottom:7px;
 border:1px solid rgba(255,255,255,.92);
 box-shadow:0 7px 20px rgba(75,51,61,.12),inset 0 1px 3px rgba(255,255,255,.95);
}
.couple .person-name{font-size:13px;letter-spacing:.025em}


/* One unbroken red cord: it travels in, loops into a heart, knots at the centre, and travels out */
.couple .heart{width:min(100%,168px);height:52px;overflow:visible}
.couple .heart-cord{
 fill:none;stroke:var(--red);stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;
 stroke-dasharray:1;stroke-dashoffset:1;
 animation:heart-cord-travel 5.2s cubic-bezier(.42,0,.28,1) infinite;
 opacity:.9;
}
@keyframes heart-cord-travel{0%{stroke-dashoffset:1}82%,100%{stroke-dashoffset:0}}
@media(max-width:390px){

 }else if(key==="note"){

 }else if(key==="chat"){
  h='<div class="surface room-card"><h3>想说的话，不必留在网页里。</h3><p>回到我们的对话窗口吧。</p><a href="https://chatgpt.com/" target="_blank" rel="noopener">回来说话 ↗</a></div>';
 }else{
  h='<section class="more-hero"><div class="more-kicker">LUNE / OUR LITTLE WORLD</div><h2>我们的</h2><p>记住的、写下的、一起走过的。</p><span class="more-rule"></span></section><section class="more-grid" aria-label="更多空间入口"><button class="more-tile" data-room="memory"><span class="more-index">01 / MEMORY</span><span class="more-arrow">↗</span><strong>记忆</strong><small>珍藏那些不想忘记的瞬间</small><i>☆</i></button><button class="more-tile" data-room="note"><span class="more-index">02 / NOTES</span><span class="more-arrow">↗</span><strong>今日纸条</strong><small>留给彼此的一句话</small><i>▤</i></button><button class="more-tile" data-room="calendar"><span class="more-index">03 / DAYS</span><span class="more-arrow">↗</span><strong>日历</strong><small>纪念日与期待中的日子</small><i>▦</i></button><button class="more-tile" data-room="album"><span class="more-index">04 / MOMENTS</span><span class="more-arrow">↗</span><strong>相册</strong><small>把走过的时光收好</small><i>◫</i></button><button class="more-tile" data-room="music"><span class="more-index">05 / MUSIC</span><span class="more-arrow">↗</span><strong>我们的歌</strong><small>收藏此刻的声音</small><i>♫</i></button></section><div class="more-section-label"><span>SPACE SETTINGS</span><span>把这里调整成喜欢的样子</span></div><form class="editor" id="profile-form"><h3 style="font:21px var(--serif);font-weight:400;margin:0 0 6px">两个人的资料</h3><p style="font-size:10px;color:var(--muted);margin:0 0 16px">把名字、头像和相伴的起点，留在这间小屋里。</p><div class="profile-grid"><section class="profile-person"><div class="profile-person-head"><div class="profile-preview" id="profile-preview-me">'+(profile.userAvatar?'<img src="'+safe(profile.userAvatar)+'" alt="">':safe(profile.userName||"我").slice(0,1))+'</div><div><div class="profile-person-title">我</div><div class="profile-person-sub">你的名字与头像</div></div></div><label for="profile-me-name">名字</label><input id="profile-me-name" name="userName" type="text" maxlength="16" value="'+safe(profile.userName)+'" placeholder="怎么称呼你"><label for="profile-me-avatar">更换头像</label><input id="profile-me-avatar" name="userAvatar" type="file" accept="image/*"></section><section class="profile-person"><div class="profile-person-head"><div class="profile-preview" id="profile-preview-partner">'+(profile.companionAvatar?'<img src="'+safe(profile.companionAvatar)+'" alt="">':safe(profile.companionName||"L").slice(0,1))+'</div><div><div class="profile-person-title">对方</div><div class="profile-person-sub">TA 的名字与头像</div></div></div><label for="profile-partner-name">名字</label><input id="profile-partner-name" name="companionName" type="text" maxlength="16" value="'+safe(profile.companionName)+'" placeholder="怎么称呼对方"><label for="profile-partner-avatar">更换头像</label><input id="profile-partner-avatar" name="companionAvatar" type="file" accept="image/*"></section></div><div class="profile-date"><label for="profile-together-date">相伴开始的日期</label><input id="profile-together-date" name="togetherSince" type="date" value="'+safe(profile.togetherSince)+'"></div><div class="profile-save-row"><button class="editor-submit" type="submit">保存资料</button><span class="profile-hint">头像会自动压缩，资料仅保存在当前设备。</span></div></form><div class="surface room-card"><h3>空间光线</h3><p>选择此刻想要的氛围。</p><div class="setting-row"><div><strong>显示主题</strong><small>在日间与夜间氛围之间切换</small></div><button class="theme-toggle" id="theme-toggle" type="button">'+(document.documentElement.dataset.theme==="night"?"☼ 日间":"☾ 夜间")+'</button></div></div>';
 }
 $("room-content").innerHTML=h;document.querySelectorAll("[data-nav-room]").forEach(b=>b.setAttribute("aria-current",b.dataset.navRoom===key?"page":"false"));window.scrollTo(0,0)
}

async function compressMusicCover(file){if(!file)return "";if(!file.type.startsWith("image/"))throw new Error("请选择图片文件");return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const scale=Math.min(1,700/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",.84))};img.src=reader.result};reader.readAsDataURL(file)})}
document.addEventListener("submit",async e=>{if(e.target.id!=="music-form")return;e.preventDefault();const form=e.target,fd=new FormData(form),link=String(fd.get("link")||"").trim();if(link){try{const u=new URL(link);if(!["http:","https:"].includes(u.protocol))throw 0}catch(err){alert("音乐链接请填写有效的 https:// 或 http:// 地址。");return}}try{const next={...localMusic,title:String(fd.get("title")||"").trim(),artist:String(fd.get("artist")||"").trim(),link};const file=form.elements.cover.files[0];if(file)next.cover=await compressMusicCover(file);try{localStorage.setItem("lune-music",JSON.stringify(next))}catch(err){alert("封面可能太大，暂时无法保存。请换一张较小的图片。");return}localMusic=next;overview();showRoom("music")}catch(err){alert("封面读取失败，请换一张图片再试。")}});
document.addEventListener("click",e=>{if(e.target.closest("#music-clear")){localMusic={};localStorage.removeItem("lune-music");overview();showRoom("music")}});
async function compressAvatar(file){if(!file)return "";if(!file.type.startsWith("image/"))throw new Error("请选择图片文件");return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const scale=Math.min(1,512/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",.86))};img.src=reader.result};reader.readAsDataURL(file)})}
document.addEventListener("submit",async e=>{if(e.target.id!=="profile-form")return;e.preventDefault();const form=e.target,fd=new FormData(form);try{const next={...profile,userName:String(fd.get("userName")||"").trim(),companionName:String(fd.get("companionName")||"").trim(),togetherSince:String(fd.get("togetherSince")||"")};const me=form.elements.userAvatar.files[0],partner=form.elements.companionAvatar.files[0];if(me)next.userAvatar=await compressAvatar(me);if(partner)next.companionAvatar=await compressAvatar(partner);try{localStorage.setItem("lune-profile",JSON.stringify(next))}catch(err){alert("资料暂时无法保存，可能是浏览器空间不足。请换小一些的头像再试。");return}profile=next;setPerson("name-me","avatar-me",profile.userName,profile.userAvatar,"我");setPerson("name-partner","avatar-partner",profile.companionName,profile.companionAvatar,"L");tick();showRoom("more");alert("两个人的资料已经保存。")}catch(err){alert("头像读取失败，请换一张图片再试。")}});

document.addEventListener("submit",e=>{
 if(e.target.id!=="memory-form")return;
 e.preventDefault();const fd=new FormData(e.target);
 const item={date:fd.get("date"),title:String(fd.get("title")||"").trim(),body:String(fd.get("body")||"").trim(),local:true,id:Date.now()};
 if(!item.title)return;
 localMemories.unshift(item);localStorage.setItem("lune-memories",JSON.stringify(localMemories));
 cache.memories.push(item);overview();showRoom("memory");
});
document.addEventListener("click",e=>{
 const del=e.target.closest("[data-delete-memory]");if(!del)return;
 const id=Number(del.dataset.deleteMemory);localMemories=localMemories.filter(x=>x.id!==id);
 localStorage.setItem("lune-memories",JSON.stringify(localMemories));
 cache.memories=cache.memories.filter(x=>x.id!==id);overview();showRoom("memory");
});
document.addEventListener("submit",async e=>{if(e.target.id!=="photo-form")return;e.preventDefault();const file=e.target.elements.photo.files[0];if(!file||!file.type.startsWith("image/"))return;const title=String(e.target.elements.title.value||"").trim();try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1500/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",.82))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)});const date=e.target.elements.date.value||localDate(),item={id:Date.now(),src:data,title,alt:title,date,local:true};localGallery.unshift(item);try{localStorage.setItem("lune-gallery",JSON.stringify(localGallery))}catch(storageError){localGallery.shift();alert("当前浏览器空间不足，请先导出备份或删除一些照片。");return}overview();showRoom("album")}catch(err){alert("这张照片暂时无法读取，请换一张试试。")}});
document.addEventListener("submit",e=>{if(e.target.id==="note-form"){e.preventDefault();const fd=new FormData(e.target);todayNotes.unshift({id:Date.now(),date:fd.get("date"),body:String(fd.get("body")||"").trim()});localStorage.setItem("lune-notes",JSON.stringify(todayNotes));showRoom("note")}if(e.target.id==="event-form"){e.preventDefault();const fd=new FormData(e.target);localEvents.push({id:Date.now(),date:fd.get("date"),title:String(fd.get("title")||"").trim(),note:String(fd.get("note")||"").trim()});localStorage.setItem("lune-events",JSON.stringify(localEvents));showRoom("calendar");calendar(new Date())}});
document.addEventListener("click",e=>{const n=e.target.closest("[data-delete-note]");if(n){todayNotes=todayNotes.filter(x=>x.id!==Number(n.dataset.deleteNote));localStorage.setItem("lune-notes",JSON.stringify(todayNotes));showRoom("note")}const d=e.target.closest("[data-delete-event]");if(d){localEvents=localEvents.filter(x=>x.id!==Number(d.dataset.deleteEvent));localStorage.setItem("lune-events",JSON.stringify(localEvents));showRoom("calendar");calendar(new Date())}});
document.addEventListener("click",e=>{const p=e.target.closest("[data-room-photo]");if(p){openPhoto(p.dataset.photoSrc,p.dataset.photoTitle);return}const d=e.target.closest("[data-delete-photo]");if(d){localGallery=localGallery.filter(x=>x.id!==Number(d.dataset.deletePhoto));localStorage.setItem("lune-gallery",JSON.stringify(localGallery));showRoom("album")}});
function openPhoto(src,title){if(!src)return;$("photo-viewer-image").src=src;$("photo-viewer-image").alt=title||"LUNE photo";$("photo-viewer-caption").textContent=title||"";$("photo-viewer").classList.add("open");$("photo-viewer").setAttribute("aria-hidden","false");document.body.style.overflow="hidden"}
function closePhoto(){$("photo-viewer").classList.remove("open");$("photo-viewer").setAttribute("aria-hidden","true");$("photo-viewer-image").src="";document.body.style.overflow=""}
let touchStartX=0,stackWasSwiped=false;$("home-photo").addEventListener("touchstart",e=>{touchStartX=e.touches[0].clientX;stackWasSwiped=false},{passive:true});$("home-photo").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-touchStartX,cards=[...$("home-photo").querySelectorAll("[data-photo-src]")];if(cards.length>1&&Math.abs(dx)>22){stackIndex=(stackIndex+(dx<0?1:-1)+cards.length)%cards.length;paintStack();stackWasSwiped=true;setTimeout(()=>{stackWasSwiped=false},350)}},{passive:true});$("home-photo").addEventListener("click",e=>{if(stackWasSwiped){e.preventDefault();e.stopPropagation();return}const p=e.target.closest("[data-photo-src]");if(p)openPhoto(p.dataset.photoSrc,p.dataset.photoTitle)});
$("home-photo").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-photo-src]")){e.preventDefault();openPhoto(e.target.dataset.photoSrc,e.target.dataset.photoTitle)}});
$("photo-viewer-close").addEventListener("click",closePhoto);
$("photo-viewer").addEventListener("click",e=>{if(e.target.id==="photo-viewer")closePhoto()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePhoto()});
function home(){ $("room").classList.remove("active");$("home").style.display="block";document.querySelectorAll("[data-nav-room]").forEach(b=>b.setAttribute("aria-current",b.dataset.navRoom==="home"?"page":"false"));window.scrollTo(0,0)}
document.querySelectorAll("[data-room]").forEach(b=>b.addEventListener("click",()=>showRoom(b.dataset.room)));document.querySelectorAll("[data-nav-room]").forEach(b=>b.addEventListener("click",()=>b.dataset.navRoom==="home"?home():showRoom(b.dataset.navRoom)));$("back").addEventListener("click",home);
$("backup").addEventListener("click",()=>{const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),config:{togetherSince:cfg.togetherSince||""},memories:cache.memories,gallery:[...cache.gallery,...localGallery],calendarEvents:localEvents,notes:todayNotes,nowPlaying:{...(cache.music||{}),...(localMusic||{})}},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="LUNE-backup-"+localDate()+".json";a.click();URL.revokeObjectURL(url)});
setPerson("name-me","avatar-me",profile.userName,profile.userAvatar,"我");setPerson("name-partner","avatar-partner",profile.companionName,profile.companionAvatar,"L");
if(cfg.accessCode){$("gate").classList.add("show");$("gate-form").addEventListener("submit",e=>{e.preventDefault();if($("gate-code").value===cfg.accessCode){$("gate").classList.remove("show");sessionStorage.setItem("lune-unlocked","1")}else $("gate-error").textContent="口令不对，再试一次。"});if(sessionStorage.getItem("lune-unlocked")==="1")$("gate").classList.remove("show")}
tick();setInterval(tick,30000);Promise.all([readJSON("./data/memories.json",[]),readJSON("./data/gallery.json",[]),readJSON("./data/now-playing.json",{})]).then(([memories,gallery,music])=>{cache={memories:[...(Array.isArray(memories)?memories:[]),...localMemories],gallery:Array.isArray(gallery)?gallery:[],music:music||{}};overview()});
