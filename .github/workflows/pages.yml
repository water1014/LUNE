name: Deploy LUNE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lune-ocean-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LUNE
        uses: actions/checkout@v4

      - name: Prepare LUNE site
        run: |
          mkdir -p /tmp/lune-site
          cp index.html config.js /tmp/lune-site/
          cp -R data /tmp/lune-site/data
          if [ -d images ]; then cp -R images /tmp/lune-site/images; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload LUNE site
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/lune-site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for GitHub's default Pages deployment to finish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          echo "Waiting for the branch-source Pages deployment for $GH_SHA"
          for attempt in $(seq 1 60); do
            response=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPOSITORY/actions/runs?head_sha=$GH_SHA&per_page=20")
            state=$(echo "$response" | jq -r '
              [.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment")]
              | sort_by(.created_at) | last | .status // empty')
            if [ "$state" = "completed" ]; then
              echo "Default Pages workflow finished. LUNE can deploy now."
              exit 0
            fi
            echo "Default Pages workflow state: ${state:-not-created}; waiting ($attempt/60)"
            sleep 10
          done
          echo "Timed out waiting for the default Pages workflow."
          exit 1

      - name: Deploy LUNE
        id: deployment
        uses: actions/deploy-pages@v4
