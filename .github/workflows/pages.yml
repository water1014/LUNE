name: Deploy Ocean interface to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lune-ocean-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LUNE deployment configuration
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the original Ocean source
        run: |
          git clone https://github.com/fishwithoctopus/Ocean.git /tmp/ocean
          git -C /tmp/ocean checkout c1bf8c6f5bf96d37e1791c22d5c81f057dadcefe

      - name: Install dependencies
        working-directory: /tmp/ocean
        run: npm ci

      - name: Build the original Ocean client for LUNE Pages
        working-directory: /tmp/ocean
        env:
          VITE_OCEAN_BASE_PATH: /LUNE/
        run: |
          find src -type f -name '*.css' -exec sed -i "s|url('/assets/|url('/LUNE/assets/|g" {} +
          npm run build:client

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/ocean/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for GitHub's default Pages deployment to finish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          echo "Waiting for the branch-source Pages deployment for $GH_SHA"
          for attempt in $(seq 1 60); do
            response=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPOSITORY/actions/runs?head_sha=$GH_SHA&per_page=20")
            state=$(echo "$response" | jq -r '
              [.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment")]
              | sort_by(.created_at) | last | .status // empty')
            conclusion=$(echo "$response" | jq -r '
              [.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment")]
              | sort_by(.created_at) | last | .conclusion // empty')
            if [ "$state" = "completed" ]; then
              echo "Default Pages workflow finished ($conclusion). Ocean can deploy now."
              exit 0
            fi
            echo "Default Pages workflow state: ${state:-not-created}; waiting ($attempt/60)"
            sleep 10
          done
          echo "Timed out waiting for the default Pages workflow."
          exit 1

      - name: Deploy Ocean to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
